name: 재정경제부 보도자료 가져오기
on:
  schedule:
    - cron: '41 */2 * * *'   # 2시간마다 (UTC 기준)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 보도자료 가져오기
        run: python3 _build/moef_feed.py feeds/moef.json
      - name: 바뀐 경우에만 저장하고 홈페이지 다시 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain feeds)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feeds
            git commit -m "재정경제부 보도자료 갱신"
            git pull --rebase origin main
            git push origin HEAD:main
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
