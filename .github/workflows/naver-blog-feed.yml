name: 네이버 블로그 최신 글 가져오기
on:
  schedule:
    - cron: '17 */3 * * *'   # 3시간마다 (UTC 기준)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RSS 가져오기
        run: python3 _build/naver_feed.py https://rss.blog.naver.com/ctasyb.xml feeds/naverblog.json
      - name: 바뀐 경우에만 저장하고 홈페이지 다시 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain feeds)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feeds
            git commit -m "네이버 블로그 최신 글 갱신"
            git pull --rebase origin main
            git push origin HEAD:main
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
