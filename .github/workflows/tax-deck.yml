name: 세법 개정 소식 PPT 만들기
on:
  push:
    branches: [main]
    paths:
      - 'data/laws.json'
      - 'data/calendar.json'
      - 'data/office.json'
      - '_build/tax_deck.js'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: tax-deck
  cancel-in-progress: false
jobs:
  deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: PPT 생성 도구 설치
        run: npm install --no-save --no-audit --no-fund pptxgenjs@4.0.1
      - name: 최신 자료로 PPT 만들기
        run: |
          node _build/tax_deck.js data files/tax-law-update.pptx
          zip -dq files/tax-law-update.pptx '*/' || true
      - name: 저장하고 홈페이지 다시 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/tax-law-update.pptx
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "세법 개정 소식 PPT 갱신 ($(python3 -c "import json;print(json.load(open('data/laws.json'))['updated'])") 기준)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
